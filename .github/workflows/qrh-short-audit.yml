name: Independent 23/24 QRH source and port audit
on:
  push:
    branches: [cloud-preflight/qrh-short-20261128]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qrh-short-20261128
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'Elm-Forest/goldbach-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve pinned short theorem and exact module closure
        run: |
          set -euxo pipefail
          git clone --depth 1 --single-branch --branch qrh-23-24-pruned --no-checkout https://github.com/akashlevy/math.git /tmp/short-source
          test "$(git -C /tmp/short-source rev-parse HEAD)" = c388e88e6519d139ad2ca5571ef0c7fbf0e245b5
          git clone --depth 1 --no-checkout https://github.com/Zhang-Liao/quasi-riemann.git /tmp/short-vendor
          git -C /tmp/short-vendor fetch --depth 1 origin 8bcf392d0ddc241a87fc8c3371273af704638f9b
          git -C /tmp/short-vendor checkout --detach FETCH_HEAD
          test "$(git -C /tmp/short-vendor rev-parse HEAD)" = 8bcf392d0ddc241a87fc8c3371273af704638f9b
          mkdir /tmp/short-qrh
          python research-audit/qrh_short_extract.py /tmp/short-source /tmp/short-vendor /tmp/short-qrh
          git -C /tmp/short-source show HEAD:LICENSE > /tmp/short-qrh/UPSTREAM-LICENSE || true
          cd /tmp/short-qrh
          cat > lakefile.lean <<'LEAN'
          import Lake
          open Lake DSL
          package «qrh-short-audit» where
            version := v!"0.1.0"
            fixedToolchain := true
            leanOptions := #[⟨`autoImplicit, false⟩]
          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"
          lean_lib OAI where
            globs := #[`OAI.+]
          lean_lib RellichKondrachov where
            globs := #[`RellichKondrachov.+]
          lean_lib PrimeNumberTheoremAnd where
            globs := #[`PrimeNumberTheoremAnd.+]
          @[default_target]
          lean_lib QRHShortAudit
          LEAN
          printf '%s\n' leanprover/lean4:v4.36.0 > lean-toolchain
          cat > QRHShortAudit.lean <<'LEAN'
          import OAI.NumberTheory.DirichletL.QRH
          theorem qrhShort_exactUniformStrip :
              ∀ (q : ℕ) [NeZero q] (χ : DirichletCharacter ℂ q) (s : ℂ),
              (23/24:ℝ) < s.re → ¬ (χ = 1 ∧ s = 1) →
              DirichletCharacter.LFunction χ s ≠ 0 := by
            intro q _ χ s hs hpole
            exact OAI.DirichletCharacter.LFunction_ne_zero_of_twenty_three_twenty_fourths_lt_re χ hs hpole
          LEAN
          cat > CheckAxioms.lean <<'LEAN'
          import QRHShortAudit
          #print axioms OAI.DirichletCharacter.LFunction_ne_zero_of_twenty_three_twenty_fourths_lt_re
          #print axioms qrhShort_exactUniformStrip
          LEAN
          du -sh .
      - name: Apply two-root compatibility patch
        run: |
          set -euxo pipefail
          cd /tmp/short-qrh
          git init -q
          git add .
          git -c user.name=Research -c user.email=research@example.invalid commit -qm pinned-source
          python - /tmp/short-qrh <<'PY'
          """Port only the two actual short-route root failures; preserve theorem statements."""
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          def edit(name, changes):
              p=root/name; s=p.read_text()
              for old,new in changes:
                  assert old in s,(name,old)
                  print(name,'replacement count',s.count(old))
                  s=s.replace(old,new)
              p.write_text(s)
          edit('RellichKondrachov/MeasureTheory/Function/LpSpace/Restrict.lean',[
           ('(f := fun x : α => f x) hs).2 hf','(f := fun x : α => f x) hs.nullMeasurableSet).2 hf'),
           ('(f := fun x : α => f x) hs).2 (Lp.memLp f)',
            '(f := fun x : α => f x) hs.nullMeasurableSet).2 (Lp.memLp f)'),
           ('(f := fun x : α => f x) hs)\n    -- Combine',
            '(f := fun x : α => f x) hs.nullMeasurableSet)\n    -- Combine')
          ])
          p=root/'OAI/NumberTheory/DirichletL/Mellin/LogProfiles.lean'
          s=p.read_text()
          i=s.index('theorem uniform_fourier_coefficient_moment')
          j=s.index(' := by\n',i)+len(' := by\n')
          k=s.index('\nnoncomputable def coefficientMomentBound',j)
          helper="""private theorem scaled_moment_combine {S V z x y a b : ℝ}
              (hS : 0 ≤ S) (hV : 0 ≤ V) (hz : z ≤ V*(x+y))
              (ha : S*x ≤ a) (hb : S*y ≤ b) :
              S*z ≤ V*(a+b) := by
            calc
              _ ≤ S*(V*(x+y)) := mul_le_mul_of_nonneg_left hz hS
              _ = V*(S*x+S*y) := by ring
              _ ≤ _ := mul_le_mul_of_nonneg_left (add_le_add ha hb) hV
          
          """
          proof="""  let p : ℕ := (volume : Measure ℝ).integrablePower
            let V : ℝ := 2 ^ p * ∫ t : ℝ, (1 + ‖t‖) ^ (-(p : ℝ))
            let K : ℕ := J+p
            let x : ℝ := (SchwartzMap.seminorm ℝ 0 0) (𝓕 g)
            let y : ℝ := (SchwartzMap.seminorm ℝ K 0) (𝓕 g)
            let a : ℝ := (2:ℝ)^0*((0:ℝ)+1)*V*C
            let b : ℝ := (2:ℝ)^K*((K:ℝ)+1)*V*C
            have hV : 0 ≤ V := by
              dsimp only [V]
              exact mul_nonneg (by positivity) (integral_nonneg fun _ => Real.rpow_nonneg (by positivity) _)
            have h0 : ∀ i ≤ (0:ℕ), S*((SchwartzMap.seminorm ℝ 0 i) g+
                (SchwartzMap.seminorm ℝ p i) g) ≤ C := by
              intro i hi
              exact hsource i (hi.trans (Nat.zero_le _))
            have hK : ∀ i ≤ K, S*((SchwartzMap.seminorm ℝ 0 i) g+
                (SchwartzMap.seminorm ℝ p i) g) ≤ C := hsource
            have ha : S*x ≤ a := by
              simpa only [x,a,V,p,Nat.cast_zero,Nat.cast_one] using
                uniform_fourier_seminorm_transfer g 0 S C hS hC h0
            have hb : S*y ≤ b := by
              simpa only [y,b,V,p,K,Nat.cast_add,Nat.cast_one] using
                uniform_fourier_seminorm_transfer g K S C hS hC hK
            have hm : (∫ t : ℝ, ‖t‖ ^ J * ‖(𝓕 g) t‖) ≤ V*(x+y) :=
              fourier_coefficient_moment g J
            have result := scaled_moment_combine hS hV hm ha hb
            simpa only [V,a,b,p,K,Nat.cast_add,Nat.cast_one,Nat.cast_zero] using result
          """
          
          # The declaration header is retained; only the tactic proof is changed.
          s=s[:i]+helper+'set_option maxHeartbeats 20000000 in\n'+s[i:j]+proof+s[k:]
          p.write_text(s)
          print("Applied two-root compatibility patch")
          PY
          git diff --stat
          git diff > /tmp/short-qrh/port-short.diff
      - name: Install pinned Lean and Mathlib
        run: |
          set -euxo pipefail
          cd /tmp/short-qrh
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
          lean --version
          nproc; free -h; df -h .
      - uses: actions/cache/restore@v4
        id: shortcache
        with:
          path: /tmp/short-qrh/.lake/build
          key: qrh-short-fc4f59e-c388e88e-${{ github.run_id }}
          restore-keys: qrh-short-fc4f59e-c388e88e-
      - name: Independent short theorem kernel replay and exact type
        run: |
          set -euxo pipefail
          cd /tmp/short-qrh
          export PATH="$HOME/.elan/bin:$PATH"
          export LEAN_NUM_THREADS=4
          time lake build QRHShortAudit 2>&1 | tee build-short.log
          lake env lean CheckAxioms.lean | tee axioms-short.log
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: /tmp/short-qrh/.lake/build
          key: ${{ steps.shortcache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-qrh-audit
          path: |
            /tmp/short-qrh/short-closure.json
            /tmp/short-qrh/port-short.diff
            /tmp/short-qrh/build-short.log
            /tmp/short-qrh/axioms-short.log
          if-no-files-found: ignore
