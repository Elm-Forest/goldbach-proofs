name: Pre-PR cached kernel verification (WideRemainderInnerFloor single-gap closure)
on:
  push:
    branches: [pre-pr/L-goldbach-wide-remainder-inner-floor-route-b]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore community build objects
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake/build
          key: inner-research-linux-x64-20261128-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml', 'lean/lakefile.lean') }}-${{ github.run_id }}
          restore-keys: |
            inner-research-linux-x64-20261128-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml', 'lean/lakefile.lean') }}-
            inner-community-linux-x64-1fe24b28-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml', 'lean/lakefile.lean') }}-
      - name: Set up pinned Lean and Mathlib
        run: |
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake exe cache get
          time lake build Conjectures.Goldbach.DyadicCellShortPrimeFloor Conjectures.Goldbach.ReflectionCharacterContraction PEqualNP.Outside.L_goldbach_frontier_type2_b1_b4 Conjectures.Goldbach.LowSkirtFromShortProgressions PEqualNP.Outside.L_goldbach_frontier_medcore_bv_band
      - name: Verify unified single-file target in kernel
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          echo "46ccd084c1836f1c5f83c518d18d645e2e55544e3e00bf8980cc7ce5c646cebc  Conjectures/Goldbach/WideRemainderInnerFloor.lean" | sha256sum -c -
          time lake env lean "Conjectures/Goldbach/WideRemainderInnerFloor.lean" 2>&1 | tee "/tmp/WideRemainderInnerFloor.log"
          python3 - << 'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/WideRemainderInnerFloor.log').read_text()
          assert 'sorryAx' not in log, 'Found sorryAx!'
          assert 'error:' not in log, 'Found error!'
          matches = re.findall(r'depends on axioms: \[([^\]]*)\]', log)
          assert len(matches) == 74, f'Expected 74 axiom audits, got {len(matches)}'
          for m in matches:
              axs = {a.strip() for a in m.split(',') if a.strip()}
              assert axs <= {'propext', 'Classical.choice', 'Quot.sound'}, f'Unexpected axioms: {axs}'
          print(f'KERNEL AUDIT PASS WideRemainderInnerFloor: {len(matches)} declarations, standard 3 axioms only!')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-pr-WideRemainderInnerFloor-log
          path: /tmp/WideRemainderInnerFloor.log
