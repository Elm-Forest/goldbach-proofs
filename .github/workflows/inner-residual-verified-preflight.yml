name: Inner floor residual and density preflight
on:
  push:
    branches: [cloud-preflight/inner-residual-verified-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Elm-Forest/goldbach-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [InnerFloorActualResidualAssemblyVerified, InnerFloorDensityArithmeticAndThresholdsVerified]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
      - name: Verify exact candidate in kernel
        working-directory: lean
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export LEAN_NUM_THREADS=2
          target="${{ matrix.target }}"
          case "$target" in
            InnerFloorActualResidualAssemblyVerified) echo "96ff11c27e2cce866b0e8f727e4f56c7ff89043a233ee513fafd9c66ac207a61  Conjectures/Goldbach/$target.lean" | sha256sum -c - ;;
            InnerFloorDensityArithmeticAndThresholdsVerified) echo "ab9bbce87fcfd31bc6421c8cc95f5ea64bfd5c2079316afec3c1656236ca7f40  Conjectures/Goldbach/$target.lean" | sha256sum -c - ;;
            *) exit 2 ;;
          esac
          time lake env lean "Conjectures/Goldbach/$target.lean" 2>&1 | tee "/tmp/$target.log"
          python3 - "$target" <<'PYAX'
          import sys,pathlib,re
          t=sys.argv[1]
          log=pathlib.Path('/tmp/'+t+'.log').read_text()
          assert 'sorryAx' not in log and 'error:' not in log
          matches=re.findall(r"depends on axioms: \[([^\]]*)\]",log)
          expected={'InnerFloorActualResidualAssemblyVerified': 31, 'InnerFloorDensityArithmeticAndThresholdsVerified': 8}
          assert len(matches)==expected[t],log[-1000:]
          for m in matches:
              assert set(a.strip() for a in m.split(',')) <= {'propext','Classical.choice','Quot.sound'},m
          print('KERNEL_AND_AXIOM_AUDIT_PASS',t)
          PYAX
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inner-${{ matrix.target }}-log
          path: /tmp/${{ matrix.target }}.log
