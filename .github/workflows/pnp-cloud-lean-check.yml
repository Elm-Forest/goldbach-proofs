name: PNP cloud Lean preflight
on:
  push:
    branches:
      - pnp/cloud-lean-preflight-20261125
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 7624
            commit: 679dc4cd59439fbcd5e3d0ccdb4feeeee91f87e1
            module: PEqualNP.Outside.R_meta_2276_726
          - pr: 7661
            commit: d7b2e3d3cdb06a8bac0eccdd7faf8811a1b67db4
            module: PEqualNP.Outside.R_meta_2436_727
    steps:
      - uses: actions/checkout@v4
        with:
          repository: open-goat/pequalnp-proofs
          ref: refs/pull/${{ matrix.pr }}/head
          persist-credentials: false
      - name: Verify pinned PR head
        run: test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
      - name: Install Lean on cloud runner
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        working-directory: lean
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
      - name: Compile submitted proof
        working-directory: lean
        run: lake build ${{ matrix.module }}
