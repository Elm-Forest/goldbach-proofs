name: PNP cloud Lean preflight
on:
  push:
    branches:
      - pnp/cloud-lean-preflight-20261125
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        module: [L_meta_1251, L_meta_1272]
    steps:
      - uses: actions/checkout@v4
        with:
          path: preflight
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: open-goat/pequalnp-proofs
          ref: f1f88ce0acb765d2c43ed7bcca8b05e248234f0a
          path: upstream
          persist-credentials: false
      - name: Copy candidate
        run: |
          f="${{ matrix.module }}.lean"
          cp "preflight/pnp-preflight-candidates/$f" "upstream/lean/PEqualNP/Outside/$f"
      - name: Install Lean on cloud runner
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        working-directory: upstream/lean
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
      - name: Compile candidate
        working-directory: upstream/lean
        run: lake build PEqualNP.Outside.${{ matrix.module }}
      - name: Audit theorem axioms
        working-directory: upstream/lean
        run: |
          printf 'import PEqualNP.Outside.%s\n#print axioms PEqualNP.Outside.%s\n' "${{ matrix.module }}" "${{ matrix.module }}" > /tmp/PNPAxioms.lean
          lake env lean /tmp/PNPAxioms.lean
