name: Inner floor auxiliary kernel preflight
on:
  push:
    branches: [cloud-preflight/inner-actual-taper-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Elm-Forest/goldbach-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - InnerFloorOccurrenceBudgetVerified
          - InnerFloorOccurrenceResidualVerified
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore community build objects
        id: community
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake/build
          key: inner-research-linux-x64-20261128-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml', 'lean/lakefile.lean') }}-${{ github.run_id }}
          restore-keys: |
            inner-research-linux-x64-20261128-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml', 'lean/lakefile.lean') }}-
            inner-community-linux-x64-1fe24b28-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml', 'lean/lakefile.lean') }}-
      - name: Set up pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          time lake build Conjectures.Goldbach.DyadicCellShortPrimeFloor
      - name: Verify exact Colab-audited candidate in kernel
        working-directory: lean
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export LEAN_NUM_THREADS=2
          target="${{ matrix.target }}"
          python3 - "$target" <<'PYSHA'
          import sys, json, hashlib, pathlib
          meta = json.loads('''{"InnerFloorOccurrenceBudgetVerified": {"sha256": "5a3c54ae31566790e879e390c37036e303810e3c674f8d80af784dbb70886d69", "count": 6, "last": "InnerFloorOccurrence.pairNearOne", "lines": 171}, "InnerFloorOccurrenceResidualVerified": {"sha256": "6929a2c146d58732819cfeb9d4f5a7773d1a3aab312be6138fc1010819b851ae", "count": 44, "last": "InnerFloorOccurrence.denominatorResidualFloor", "lines": 3218}}''')
          t = sys.argv[1]
          p = pathlib.Path(f"Conjectures/Goldbach/{t}.lean")
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual == meta[t]["sha256"], f"SHA mismatch: {actual} != {meta[t]['sha256']}"
          print("EXACT_SHA_VERIFIED", t, actual, "lines:", meta[t]["lines"])
          PYSHA
          time lake env lean "Conjectures/Goldbach/$target.lean" 2>&1 | tee "/tmp/$target.log"
          python3 - "$target" <<'PYAX'
          import sys, pathlib, re, json
          meta = json.loads('''{"InnerFloorOccurrenceBudgetVerified": {"sha256": "5a3c54ae31566790e879e390c37036e303810e3c674f8d80af784dbb70886d69", "count": 6, "last": "InnerFloorOccurrence.pairNearOne", "lines": 171}, "InnerFloorOccurrenceResidualVerified": {"sha256": "6929a2c146d58732819cfeb9d4f5a7773d1a3aab312be6138fc1010819b851ae", "count": 44, "last": "InnerFloorOccurrence.denominatorResidualFloor", "lines": 3218}}''')
          t = sys.argv[1]
          log = pathlib.Path('/tmp/' + t + '.log').read_text()
          assert 'sorryAx' not in log and 'error:' not in log, log[-1000:]
          matches = re.findall(r"depends on axioms: \[([^\]]*)\]", log)
          assert len(matches) == meta[t]["count"], f"Expected {meta[t]['count']} audits, got {len(matches)}"
          assert f"'{meta[t]['last']}' depends on axioms:" in log, f"Missing final theorem audit {meta[t]['last']}"
          for m in matches:
              assert set(a.strip() for a in m.split(',')) <= {'propext', 'Classical.choice', 'Quot.sound'}, m
          print('KERNEL_AND_AXIOM_AUDIT_PASS', t, 'audits:', len(matches))
          PYAX
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inner-${{ matrix.target }}-log
          path: /tmp/${{ matrix.target }}.log
