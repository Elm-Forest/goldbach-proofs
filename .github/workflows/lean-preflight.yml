name: Lean cloud preflight
on:
  push:
    branches:
      - cloud-preflight/arc-perturbation-20261125
permissions:
  contents: read
jobs:
  compile:
    if: github.repository == 'Elm-Forest/goldbach-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean and prebuilt Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
      - name: Compile batch of candidate proofs
        working-directory: lean
        run: |
          set -u
          export PATH="$HOME/.elan/bin:$PATH"
          fail=0
          for proof in ../batch-10-proofs/L_*.lean; do
            echo "::group::$(basename "$proof")"
            if timeout 240 lake env lean "$proof"; then
              echo "PREFLIGHT PASS: $(basename "$proof")"
              echo "- PASS: $(basename "$proof")" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PREFLIGHT FAIL: $(basename "$proof")"
              echo "- FAIL: $(basename "$proof")" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
